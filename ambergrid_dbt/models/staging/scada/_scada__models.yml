version: 2

models:
  - name: stg_scada__telemetry
    description: >
      One row per bioreactor reading, typed from the raw_record VARIANT with
      the nested sensor_readings object flattened out.
    columns:
      - name: event_id
        description: Reading identifier, a UUID generated by the device.
        tests:
          - unique
          - not_null

      - name: plant_id
        description: Plant the reading came from, taken from the S3 path.
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_postgres__plants')
                field: plant_id

      - name: bioreactor_id
        description: Bioreactor within the plant, in the form BIOR-001-01.
        tests:
          - not_null

      - name: firmware_version
        description: Firmware running on the device at the time of the reading.

      - name: sensor_status
        description: Device reported health.

      - name: methane_purity_pct
        description: Methane purity of the biogas, percent.

      - name: digestate_temperature_celsius
        description: Digestate temperature, degrees celsius.

      - name: pressure_level_bar
        description: Vessel pressure, bar.

      - name: ambient_gas_leak_ppm
        description: Ambient gas detected near the vessel, parts per million.

      - name: is_gas_leak_alarm_triggered
        description: Whether the device raised a gas leak alarm.

      - name: reading_at
        description: When the reading was taken. Stored with its UTC offset.

      - name: reading_date
        description: Reading date taken from the S3 path. Partition key.

      - name: _payload_plant_name
        description: >
          Plant name as the device reported it.

      - name: _source_file_name
        description: "{{ doc('stg_source_file_name') }}"
